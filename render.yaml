services:
  # PRIVASCOPE Backend Web Service (FastAPI)
  - type: web
    name: privascope-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: privascope-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: https://privascope.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DEFAULT_GATEWAY_PROVIDER
        value: local_demo

  # PRIVASCOPE Frontend Static Site (React + Vite)
  - type: web
    name: privascope-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://privascope-api.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

databases:
  # Managed PostgreSQL Database
  - name: privascope-db
    databaseName: privascope
    user: privascope_admin
    plan: free
