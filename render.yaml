services:
  # PRIVASCOPE Backend Web Service (FastAPI)
  # Free deployment architecture: Vercel (Frontend) + Render Free (Backend Docker) + Supabase Free (PostgreSQL)
  - type: web
    name: privascope-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DEFAULT_GATEWAY_PROVIDER
        value: local_demo
